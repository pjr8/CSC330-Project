<!DOCTYPE html>
<html>
<head>
    <title>SCSU Study Group Scheduler - Login</title>
</head>
<body>
    <h1>SCSU Study Group Scheduler</h1>
    <h2>Login</h2>

    <form method="POST">
        <label>SCSU Email:</label><br>
        <input type="text" name="email" placeholder="Enter your SCSU email"><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" placeholder="Enter your password"><br><br>

        <button type="submit">Login</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
