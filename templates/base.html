<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Study Group App{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header" aria-label="SCSU Study Group Scheduler">
  <div class="site-header__inner">
    <a class="brand-logo" href="{{ url_for('home') }}" aria-label="Southern Connecticut State University Study Group Scheduler home">
      <img
        src="{{ url_for('static', filename='images/scsu-logo.png') }}"
        alt="Southern Connecticut State University"
        class="brand-logo__image">
    </a>

    <nav class="top-nav" aria-label="Primary navigation">
      <a class="top-nav__link" href="{{ url_for('home') }}">Home</a>
      <a class="top-nav__link" href="/messages">Messages</a>
      <a class="top-nav__link" href="{{ url_for('profile') }}">Profile</a>
      <a class="top-nav__link top-nav__link--quiet" href="{{ url_for('logout') }}">Logout</a>
    </nav>
  </div>
</header>

<main id="main-content" class="app-shell">
  {% block content %}{% endblock %}
</main>

</body>
</html>
