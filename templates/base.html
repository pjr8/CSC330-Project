<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Study Group App{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark scsu-navbar">
  <div class="container">

    <!-- Logo + Brand -->
    <a class="navbar-brand d-flex align-items-center" href="{{ url_for('profile') }}" aria-label="Southern Connecticut State University profile home">
      <img src="{{ url_for('static', filename='images/scsu-logo.png') }}"
           alt="Southern Connecticut State University"
           class="scsu-logo me-2">
    </a>

    <!-- Navigation -->
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="{{ url_for('home') }}">Home</a>
      <a class="nav-link" href="{{ url_for('profile') }}">Profile</a>
    </div>

  </div>
</nav>

<!-- ================= CONTENT ================= -->
<main class="container py-5">
  {% block content %}{% endblock %}
</main>

</body>
</html>
