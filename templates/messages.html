<!DOCTYPE html>
<html>
<head>
    <title>SCSU Messages</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #FFFFFF;
        }

        .header {
            background: #003399;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
        }

        .header img {
            height: 40px;
            margin-right: 15px;
        }

        .home-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 6px;
            padding: 8px 14px;
        }

        .home-link:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .container {
            display: flex;
            height: 90vh;
        }

        .sidebar {
            width: 30%;
            border-right: 1px solid #ccc;
            background: #f7f9fc;
            padding: 10px;
        }

        .chat-user {
            display: block;
            padding: 12px;
            margin-bottom: 5px;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            color: #222;
            text-decoration: none;
        }

        .chat-user.active {
            background: #003399;
            color: white;
        }

        .chat {
            width: 70%;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #ccc;
            font-weight: bold;
            color: #003399;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
            max-width: 60%;
            padding: 10px;
            border-radius: 10px;
        }

        .sent {
            background: #003399;
            color: white;
            margin-left: auto;
        }

        .received {
            background: #e6e6e6;
        }

        .empty-chat {
            color: #777;
            text-align: center;
            margin-top: 30px;
        }

        .input-box {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ccc;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-left: 10px;
            padding: 12px 20px;
            background: #003399;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #016ABD;
        }
    </style>
</head>

<body>
<div class="header">
    <div class="header-brand">
        <img src="{{ url_for('static', filename='images/scsu-logo.png') }}" alt="SCSU Logo">
        <h2>Student Messaging Portal</h2>
    </div>
    <a class="home-link" href="{{ url_for('home') }}">Back to Home</a>
</div>

<div class="container">
    <div class="sidebar">
        {% for contact in contacts %}
            <a href="{{ url_for('messages', user=contact.getFullName()) }}"
               class="chat-user {% if current_user == contact.getFullName() %}active{% endif %}">
                {{ contact.getFullName() }}
            </a>
        {% endfor %}
    </div>

    <div class="chat">
        <div class="chat-header">{{ current_user }}</div>

        <div class="messages">
            {% if messages %}
                {% for msg in messages %}
                    <div class="message {{ 'sent' if msg.sender.getFullName() == signed_in_user else 'received' }}">
                        {{ msg.content }}
                    </div>
                {% endfor %}
            {% else %}
                <div class="empty-chat">No messages yet.</div>
            {% endif %}
        </div>

        <form method="POST" class="input-box">
            <input type="text" name="message" placeholder="Type your message..." required>
            <button type="submit">Send</button>
        </form>
    </div>
</div>
</body>
</html>
