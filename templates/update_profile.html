{% extends "base.html" %}

{% block title %}Update Profile | SCSU Study Group Scheduler{% endblock %}

{% block content %}
<section class="editor-shell" aria-labelledby="edit-profile-title">
  <div class="editor-intro">
    <p class="eyebrow">Profile settings</p>
    <h1 id="edit-profile-title">Update your profile</h1>
    <p>Help classmates understand your major, study interests, and preferred ways to connect.</p>
  </div>

  <form method="POST" class="profile-form">
    <div class="form-grid">
      <div class="form-field">
        <label for="firstName">First name</label>
        <input id="firstName" name="firstName" placeholder="First name" value="{{ user.firstName }}">
      </div>

      <div class="form-field">
        <label for="lastName">Last name</label>
        <input id="lastName" name="lastName" placeholder="Last name" value="{{ user.lastName }}">
      </div>
    </div>

    <div class="form-field">
      <label for="major">Major</label>
      <input id="major" name="major" placeholder="Major" value="{{ user.major }}">
    </div>

    <div class="form-field">
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" rows="5" placeholder="Share how you like to study, what courses you are focused on, or what kind of group works best for you.">{{ user.bio }}</textarea>
    </div>

    <div class="form-field">
      <label for="interests">Interests</label>
      <input id="interests" name="interests" placeholder="Calculus, biology, writing center, exam prep" value="{{ user.interests | join(', ') }}">
    </div>

    <div class="form-field">
      <label for="contactInfo">Best ways to reach you</label>
      <textarea id="contactInfo" name="contactInfo" rows="4" placeholder="Email, Discord, phone, or preferred meeting notes">{{ user.contactInfo }}</textarea>
    </div>

    <div class="form-actions">
      <a class="button button--text" href="{{ url_for('profile') }}">Cancel</a>
      <button class="button button--primary" type="submit">Save changes</button>
    </div>
  </form>
</section>
{% endblock %}
