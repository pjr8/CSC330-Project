<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCSU Study Group Scheduler - Register</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(180deg, #eef4ff 0%, #ffffff 55%);
            color: #101828;
            font-family: Arial, sans-serif;
        }

        .auth-panel {
            width: min(100%, 480px);
            padding: 32px;
            background: #ffffff;
            border: 1px solid #d8e0ec;
            border-top: 6px solid #003399;
            border-radius: 10px;
            box-shadow: 0 18px 44px rgba(16, 24, 40, 0.08);
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #016abd;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            color: #003399;
            font-size: 32px;
        }

        p {
            margin: 0 0 18px;
            line-height: 1.5;
        }

        .form-field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #c7d3e0;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 12px 16px;
            background: #003399;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #016abd;
        }

        .notice {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 6px;
            background: #eef6ff;
            color: #003399;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #003399;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="auth-panel">
        <p class="eyebrow">SCSU Study Group Scheduler</p>
        <h1>Create Account</h1>
        <p>Register with your campus email so you can join study groups and stay connected.</p>

        <form method="POST">
            <div class="form-field">
                <label for="firstName">First Name</label>
                <input id="firstName" type="text" name="firstName">
            </div>

            <div class="form-field">
                <label for="lastName">Last Name</label>
                <input id="lastName" type="text" name="lastName">
            </div>

            <div class="form-field">
                <label for="major">Major</label>
                <input id="major" type="text" name="major">
            </div>

            <div class="form-field">
                <label for="email">SCSU Email</label>
                <input id="email" type="email" name="email">
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password">
            </div>

            <button type="submit">Register</button>
        </form>

        {% if notice %}
            <p class="notice">{{ notice }}</p>
        {% endif %}

        <a class="back-link" href="/messages">Back to messages</a>
    </main>
</body>
</html>
